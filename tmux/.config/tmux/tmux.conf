# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'


# Setting theme
set -g @catppuccin_flavor 'mocha'

# Use modern terminal definition
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g terminal-features ",*:RGB"

# Enable italics
set -as terminal-overrides ',*:sitm=\E[3m'
set -as terminal-overrides ',*:ritm=\E[23m'

# Needed by pi-agent

set -g extended-keys on
set -g extended-keys-format csi-u


# Enable mouse
set -g mouse on

#Setting the base index as 1
set -g base-index 1
set-window-option -g pane-base-index 1

# Forcing VIM bindings
set-window-option -g mode-keys vi

unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Improve colors
set -g default-terminal 'screen-256color'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Changing default prefix
unbind C-b
set -g prefix C-Space

# Reload config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Navigation Among Panes

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Get a custom cheatsheet

bind -n M-o display-popup -h 27 -w 110 -E "tmux new-session -A -s scratch"

##############
### DESIGN ###
##############

# panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=red

## Status bar design
# status line
set -g status-justify left
#set -g status-bg default
set -g status-style fg=blue
set -g status-interval 2


# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set-window-option -g monitor-activity off
set -g bell-action none


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOME/.config/tmux/plugins/tpm/tpm'
